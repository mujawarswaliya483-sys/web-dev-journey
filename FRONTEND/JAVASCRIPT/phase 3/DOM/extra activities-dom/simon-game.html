<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <style>

       body{
        text-align: center;
        background:linear-gradient(green);
       }

       .btn{
        height: 200px;
        width: 200px;
        border-radius: 20%;
        border: 10px solid black;

       }

<body>

    <div class="line-two">

    </div>
    </div>

    <script>
        let gameSeq=[];

        let btns = ["yellow","red","green","purple"];

        let started = false;
        let level = 0;

        document.addEventListener("keypress",function(){
            if(started==false){
                console.log("game is started");
                started = true;
                
                levelup();
            }  
        });

        function btnflash(btn){
            btn.classList("flash");
            setTimeout(function(){
               btn.classList.remove("flash"); 
            },1000);
        }

</html>
