// 1. Creating a promise
const checkServerStatus = new Promise((resolve, reject) => {
  let success = true; // Simulating a server task outcome

  if (success) {
    resolve("Server is running smoothly!"); // Moves to Fulfilled
  } else {
    reject("Could not connect to the server."); // Moves to Rejected
  }
});

// 2. Consuming the promise
checkServerStatus
  .then((message) => {
    console.log("Success: " + message);
  })
  .catch((error) => {
    console.error("Error: " + error);
  });
