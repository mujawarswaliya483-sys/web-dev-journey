<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
</head>
<style>
    body{
        background-color: rgb(99, 72, 124);
    }
    #mainImg{
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        padding: 30px;
        margin: 400px;
        background-color: rgb(16, 151, 151); 
        border-radius: 30px; 
    }

    .images{
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 40px;
        padding:30px;
        gap: 30px;
        
    }

    #img1{
        border-radius: 10px;
    }

    #img1:hover{
        width: 300px;
        height: 300px;

    }
    #img2{
border-radius: 10px;
    }
    #img2:hover{
         width: 300px;
        height: 300px;
    }
    #img3{
border-radius: 10px;
    }
    #img3:hover{
         width: 300px;
        height: 300px;
    }
</style>
<body>
    <img id="mainImg" src="images/images (4).jpeg" alt="image 1" width="400">
    <br><br>
    <div class="images">
    <img src="images/images (1).jpeg" width="200" height="200" alt="" id="img1">
    <img src="images/images (2).jpeg" alt="" width="200" height="200" id="img2">
    <img src="images/img 5.jpg" alt=""width="200" height="200" id="img3">
</div>
    <script>
        const mainImg = document.getElementById("mainImg");
        
        let img1 = document.getElementById("img1");
        let img2 = document.getElementById("img2");
        let img3 = document.getElementById("img3");
        
        img1.addEventListener("click",function(){
            mainImg.src="images/images (1).jpeg";
            document.body.style.backgroundColor="lightblue";
            document.body.style.transition="0.2s";
        });

        img2.addEventListener("click",function(){
            mainImg.src="images/images (2).jpeg";
            document.body.style.backgroundColor="purple";
            document.body.style.transition="0.2s";
        });

        img3.addEventListener("click",function(){
            mainImg.src="images/img 5.jpg"
            document.body.style.backgroundColor="lightgreen";
            document.body.style.transition="0.2s";
        });
    </script>
</body>
</html>
