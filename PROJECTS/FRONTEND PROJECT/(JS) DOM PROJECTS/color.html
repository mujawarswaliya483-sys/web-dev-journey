<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            text-align: center;
            margin-top: 450px;
            background:linear-gradient(to right bottom,rgb(191, 255, 0),rgb(255, 145, 0));
            background-repeat: no-repeat;
            height: 100vh;

        }
        h1{
            background-color: brown;
            width: 500px;
            margin-left: 250px;
            color: aliceblue;
            border-radius: 10px;
        }

        h1:hover{
            background-color: beige;
            color: black;
            box-shadow: 5px 5px 10px rgb(248, 57, 5);
            transition:0.2s;
            width: 550px;
            border-radius: 20px;
        }
        #color{
            background-color: rgb(43, 168, 226);
            color: aliceblue;
            border-radius: 10px;
            height: 50px;
            width: 100px;
            padding: 12px;
            font-weight: bold;
            font-size: larger;
            border: none;
        }
        option{
            border-radius: 15px;
            background-color: blueviolet;
            font-size: larger;
            font-weight: bold;
        }
        #color:hover{
            background-color: rgb(196, 213, 255);
            border-radius: 50px;
            box-shadow: 10px 5px 10 black;
            transition: 0.2s ;
        }
    </style>
</head>
<body>
    <h1>COLOR CHANGER</h1>
    <select name="white" id="color">
        <option value="white">white</option>
        <option value="red">red</option>
        <option value="blue">blue</option>
        <option value="green">green</option>
        <option value="yellow">yellow</option>
    </select>
    <script>
        const color=document.getElementById("color");

        color.addEventListener("change",function(event){
            document.body.style.backgroundColor=color.value;

        });
    </script>
    
</body>
</html>
