<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<style>
    body{
        background-color: rgb(99, 72, 124);
        color: white;
        margin: 0;
        
        
    }
    #num1, #num2{
        border-radius: 5px;
        box-shadow: 5px 5px 10px rgba(198, 195, 25, 0.258);
        background-color: rgb(181, 50, 196);
        color: white;
        padding: 10px; 
        display: block; 
    }

    .container{
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px; 
        height: 50vh;
        width:45vw;
        margin: auto;
        margin-top: 100px;
        background-color: rgb(16, 247, 247);
        border-radius: 30px;
        opacity: 0.8;
        border:1px solid white;
    }
    #btn{
        border-radius: 5px;
        box-shadow: 5px 5px 10px rgba(0, 123, 255, 0.258);
        background-color: rgb(181, 50, 196);
        color: white;
        padding: 10px; 
        width: 100px;
        font-family: 'Courier New', Courier, monospace;   
    }
</style>

<body>
    <div class="container">
         <input type="number" id="num1" placeholder="first number">
    <br><br>
    <input type="number" id="num2" placeholder="second number">
    <br><br>
    <button id="btn">Add</button>
    <h2 id="result"></h2>
    </div>
   
    <script>
        const btn = document.getElementById("btn");
        const num1 = document.getElementById("num1");
        const num2= document.getElementById("num2");
        const result = document.getElementById("result");

        btn.addEventListener("click",function(){
            const first = Number(num1.value);
            const second = Number(num2.value);
            const sum = first + second;
            result.innerText="Result: " + sum;
        });
    </script>

</body>
</html>
