<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fish School Cursor Trail</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    
    overflow: hidden;
    cursor: none;
  }
  canvas { display: block; }
  .hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.35);
    font: 13px/1.4 system-ui, -apple-system, sans-serif;
    letter-spacing: 0.03em;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="hint">hi</div>
<h1>hello world</h1>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let width, height;
  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * devicePixelRatio;
    canvas.height = height * devicePixelRatio;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- Pointer = the "bait" every fish swims toward ----
  const bait = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  function setBait(x, y) { bait.x = x; bait.y = y; }
  window.addEventListener('mousemove', e => setBait(e.clientX, e.clientY));
  window.addEventListener('touchmove', e => {
    if (e.touches.length) { setBait(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }
  }, { passive: false });

  // ---- One "fish": a chain of segments where each link eases toward the
  // link in front of it (classic follow-the-leader / inverse-kinematics
  // chain). The very first link chases the bait itself. A slow sine wave
  // is added perpendicular to the body so it swishes like a real fish
  // tail instead of a rigid rod. ----
  class Fish {
    constructor(segmentCount, chaseSpeed, hueBase, waveAmp, waveFreq, phase, offsetX, offsetY) {
      this.segmentCount = segmentCount;
      this.chaseSpeed = chaseSpeed;     // how eagerly the head chases the bait (0-1)
      this.hueBase = hueBase;           // base color for this fish
      this.waveAmp = waveAmp;           // how much the tail swishes
      this.waveFreq = waveFreq;
      this.phase = phase;               // desync fish so they don't move in lockstep
      this.offsetX = offsetX;
      this.offsetY = offsetY;
      this.points = [];
      for (let i = 0; i < segmentCount; i++) {
        this.points.push({
          x: bait.x + offsetX,
          y: bait.y + offsetY
        });
      }
    }

    update(time) {
      const pts = this.points;

      // Head chases the bait with lag (spring/lerp toward pointer).
      pts[0].x += (bait.x + this.offsetX - pts[0].x) * this.chaseSpeed;
      pts[0].y += (bait.y + this.offsetY - pts[0].y) * this.chaseSpeed;

      // Every other segment chases the segment ahead of it, each with a
      // touch less urgency, which is what stretches the body out into a
      // trailing line rather than bunching up.
      for (let i = 1; i < pts.length; i++) {
        pts[i].x += (pts[i - 1].x - pts[i].x) * 0.55;
        pts[i].y += (pts[i - 1].y - pts[i].y) * 0.55;
      }
    }

    draw(ctx, time) {
      const pts = this.points;
      const n = pts.length;

      // Direction of the whole body, used to offset each segment
      // perpendicular to travel for the swishing tail motion.
      const offsets = pts.map((p, i) => {
        const prev = pts[Math.max(0, i - 1)];
        const next = pts[Math.min(n - 1, i + 1)];
        const dx = next.x - prev.x;
        const dy = next.y - prev.y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len, ny = dx / len;
        const t = i / n; // 0 head -> 1 tail
        const wave = Math.sin(time * this.waveFreq - i * 0.6 + this.phase) * this.waveAmp * t;
        return { x: p.x + nx * wave, y: p.y + ny * wave };
      });

      // Draw as a tapering stroked curve: thick + bright near the head,
      // thin + faint near the tail. Segment-by-segment width change is
      // what gives the "long line" fish silhouette instead of a chain of
      // dots.
      for (let i = 0; i < n - 1; i++) {
        const t = i / n;
        const width = Math.max(0.6, 6 * (1 - t));
        const alpha = Math.max(0, 1 - t * 1.05);
        const hue = (this.hueBase + t * 40) % 360;

        ctx.beginPath();
        ctx.moveTo(offsets[i].x, offsets[i].y);
        // quadratic through the midpoint keeps the line silky-smooth
        const mx = (offsets[i].x + offsets[i + 1].x) / 2;
        const my = (offsets[i].y + offsets[i + 1].y) / 2;
        ctx.quadraticCurveTo(offsets[i].x, offsets[i].y, mx, my);
        ctx.lineTo(offsets[i + 1].x, offsets[i + 1].y);

        ctx.strokeStyle = `hsla(${hue}, 100%, 60%, ${alpha})`;
        ctx.shadowColor = `hsla(${hue}, 100%, 60%, ${alpha})`;
        ctx.shadowBlur = 10;
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.stroke();
      }
    }
  }

  // ---- Build a small school. Each fish has slightly different chase
  // speed, wave frequency/phase and hue so the group reads as living
  // creatures rather than clones. ----
  const FISH_COUNT = 15;
  const fish = [];
  for (let i = 0; i < FISH_COUNT; i++) {
    const chaseSpeed = 0.8 + Math.random() * 0.2;      // fast, realtime follow
    const segmentCount = 15 + Math.floor(Math.random() * 10); // reduced length
    const hueBase = (360 / FISH_COUNT) * i;
    const waveAmp = 6 + Math.random() * 6;             // restore original wave amplitude
    const waveFreq = 0.08 + Math.random() * 0.06;      // restore original wave frequency
    const phase = Math.random() * Math.PI * 2;
    
    // Moderately spread them out to create space in between lines
    const angle = (Math.PI * 2 / FISH_COUNT) * i + (Math.random() - 0.5);
    const radius = 20 + Math.random() * 30; // reduced radius for less spacing
    const offsetX = Math.cos(angle) * radius;
    const offsetY = Math.sin(angle) * radius;
    
    fish.push(new Fish(segmentCount, chaseSpeed, hueBase, waveAmp, waveFreq, phase, offsetX, offsetY));
  }

  let time = 0;
  function frame() {
    time += 1;
    ctx.clearRect(0, 0, width, height);

    for (const f of fish) {
      f.update(time);
      f.draw(ctx, time);
    }
    ctx.shadowBlur = 0;

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
