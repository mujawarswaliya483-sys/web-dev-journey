<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>News You Can Trust</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center p-6">

    <!-- Main Card -->
    <main class="w-full max-w-lg bg-blue-500 p-2 rounded-2xl shadow-xl">

        <!-- White Content Area -->
        <div class="bg-white rounded-xl p-8 text-center">

            <!-- Heading -->
            <h1 class="text-3xl font-bold text-blue-900 mb-4 bg-blue-900 text-white p-4 rounded-lg">
                News You Can Trust.
            </h1>

            <!-- Subtitle -->
            <h2 class="text-xl font-semibold text-gray-800 mb-3">
                Stay up to date with the latest!
            </h2>

            <!-- Description -->
            <p class="text-gray-600 leading-relaxed mb-6">
                Subscribe to our newsletter for the latest news
                straight into your inbox!
            </p>

            <!-- Email Input -->
            <input
                type="email"
                placeholder="you@example.com"
                class="w-full border border-gray-300 rounded-lg px-4 py-3
                       outline-none focus:ring-2 focus:ring-blue-500
                       focus:border-blue-500"
            >

            <!-- Subscribe Button -->
            <button
                class="w-full bg-blue-500 hover:bg-blue-700
                       text-white font-semibold
                       py-3 px-4 rounded-lg
                       mt-4 transition duration-200
                       cursor-pointer"
            >
                Subscribe Now
            </button>

            <!-- Social Media Text -->
            <p class="text-sm text-gray-500 mt-6">
                Follow us on social media for more updates!
            </p>

        </div>

    </main>

</body>

</html>
